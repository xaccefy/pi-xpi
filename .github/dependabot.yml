version: 2
updates:
  # Keep npm dependencies (incl. @earendil-works/pi-* and @sinclair/typebox) current.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait before adopting brand-new releases (compromised-package window).
    # Advisory-driven security updates bypass cooldown.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - "dependencies"

  # Keep GitHub Actions workflows themselves up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "github-actions"
