name: Release

# Manual trigger. Bumps all workspace packages + umbrella, runs the full
# verify suite, publishes to npm, tags vX.Y.Z, and pushes. Requires NPM_TOKEN.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node (for npm publish)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile
        timeout-minutes: 5

      - name: Version bump (${{ inputs.bump }})
        run: bun run version:${{ inputs.bump }}

      - name: Validate release tree
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun test --isolate
          bunx @biomejs/biome ci . --diagnostic-level=error
          npm pack --workspaces --dry-run --json --ignore-scripts > /tmp/workspace-packs.json
          npm pack --dry-run --json --ignore-scripts > /tmp/umbrella-pack.json
          unexpected="$(git diff --name-only | grep -Ev '^(package.json|plugin.json|bun.lock|packages/[^/]+/package.json)$' || true)"
          test -z "$unexpected" || { echo "Unexpected release changes:"; echo "$unexpected"; exit 1; }
          test -n "$(git diff --name-only)" || { echo "Version bump produced no changes"; exit 1; }
        timeout-minutes: 15

      - name: Commit and tag release candidate
        timeout-minutes: 5
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION="$(node -p "require('./package.json').version")"
          if git rev-parse "v${VERSION}" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists"
            exit 1
          fi
          git add package.json plugin.json bun.lock packages/*/package.json
          git diff --cached --quiet && { echo "No version files changed"; exit 1; }
          git commit -m "chore: release v${VERSION}"
          git tag "v${VERSION}"

      - name: Publish workspaces in dependency order, then umbrella
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "Authenticated to npm as: $(npm whoami)"
          bun run publish:all
        timeout-minutes: 15

      - name: Push release commit and tag
        timeout-minutes: 5
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          git push origin HEAD:main
          git push origin "v${VERSION}"
