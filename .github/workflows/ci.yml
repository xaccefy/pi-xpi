name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref so queued commits don't pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile
        timeout-minutes: 5

      # Biome CI mode: non-interactive, fails on diagnostics at the chosen level.
      - name: Lint (Biome)
        run: bunx @biomejs/biome ci . --diagnostic-level=error
        timeout-minutes: 5

      - name: Typecheck
        run: bun run typecheck
        timeout-minutes: 5

      - name: Test
        run: bun test --isolate
        timeout-minutes: 10
