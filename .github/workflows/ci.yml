name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref so queued commits don't pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile
        timeout-minutes: 5

      # Biome CI mode: non-interactive, fails on diagnostics at the chosen level.
      - name: Lint (Biome)
        run: bunx @biomejs/biome ci . --diagnostic-level=error
        timeout-minutes: 5

      - name: Typecheck
        run: bun run typecheck
        timeout-minutes: 5

      - name: Installer smoke test
        run: bash scripts/test-install.sh
        timeout-minutes: 2

      - name: Test
        run: bun test --isolate
        timeout-minutes: 10
